<section class="animate-in">
  <div class="mb-7">
    <div
      class="mb-1 text-[11px] font-semibold uppercase tracking-[.18em] text-primary"
    >
      Organize / {{ vm.currentYear }}
    </div>
    <h1 class="font-display text-[2.4rem]">Yearly summary</h1>
    <p class="mt-2 text-sm leading-6 text-muted-foreground">
      A quiet overview of your year so far.
    </p>
  </div>
  <div *ngIf="vm.connection() === 'checking'" class="mb-5 flex items-center gap-3 rounded-xl border border-border bg-muted/30 px-4 py-3 text-xs text-muted-foreground" role="status" aria-live="polite">
    <i-lucide name="loader-2" [size]="14" class="animate-spin motion-reduce:animate-none"></i-lucide>
    Loading yearly summary…
  </div>

  <div *ngIf="vm.connection() === 'disconnected'" class="mb-5 flex flex-col gap-3 rounded-xl border border-destructive/30 bg-destructive/5 px-4 py-3 text-xs text-destructive sm:flex-row sm:items-center sm:justify-between" role="alert">
    <span>Could not load yearly summary from the API. Check your connection and try again.</span>
    <button (click)="vm.testConnection()" class="inline-flex items-center gap-2 rounded-lg border border-destructive/40 px-3 py-1.5 text-xs font-semibold transition-colors hover:bg-destructive/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring motion-reduce:transition-none" aria-label="Retry loading yearly summary">
      <i-lucide name="refresh-cw" [size]="13"></i-lucide>Retry
    </button>
  </div>

  <div *ngIf="vm.connection() === 'connected'" class="grid gap-5 sm:grid-cols-3">
    <div
      *ngFor="let c of summaryStats"
      class="rounded-2xl border border-card-border bg-card p-6 shadow-soft"
    >
      <i-lucide [name]="c.i" [size]="19" class="text-primary"></i-lucide>
      <div
        class="mt-6 text-[11px] uppercase tracking-[.13em] text-muted-foreground"
      >
        {{ c.l }}
      </div>
      <div class="mt-2 font-display text-3xl">{{ c.v }}</div>
    </div>
  </div>
  <section *ngIf="vm.connection() === 'connected'"
    class="mt-5 rounded-2xl border border-card-border bg-card p-6 shadow-soft"
  >
    <h2 class="font-display text-xl">Monthly movement</h2>
    <div class="mt-8 grid h-[210px] grid-cols-3 items-end gap-3 sm:grid-cols-6">
      <div
        *ngFor="let item of vm.reportMonths()"
        class="rounded-t-lg bg-primary/70"
        [style.height.%]="
          vm.reportMonths().length
            ? (item.amount / (vm.reportMax || 1)) * 100
            : 0
        "
      >
        <div
          class="mt-2 translate-y-full text-center text-[10px] text-muted-foreground"
        >
          {{ item.label }}
        </div>
      </div>
    </div>
  </section>
</section>
